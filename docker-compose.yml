version: "3.9"

services:

  mysql:
    image: mysql:8.4
    container_name: event-mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: event_management_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql

  python-ai:
    build:
      context: ./python-ai

    container_name: python-ai

    restart: always

    env_file:
      - ./python-ai/.env

    ports:
      - "8000:8000"

  backend:
    build:
      context: ./event-management-backend

    container_name: event-backend

    restart: always

    depends_on:
      - mysql
      - python-ai

    ports:
      - "8080:8080"

    environment:
      SPRING_PROFILES_ACTIVE: docker
      MAIL_USERNAME: sankalp18802@gmail.com
      MAIL_PASSWORD: wpccuayivmtdbihe

  frontend:
    build:
      context: ./event-management-frontend
      args:
        VITE_API_URL: http://localhost:8080

    container_name: event-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "80:80"

volumes:
  mysql-data: